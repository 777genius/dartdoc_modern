# Temporary workflow for the upstream sync draft PR.
# Remove this once the merge and all E2E gates have been validated.
name: Upstream sync inspection (temporary)

on:
  push:
    branches: [chore/upstream-sync-2026-11-05]
    paths:
      - .github/workflows/upstream-sync-once.yml
      - tool/upstream-sync-resolutions.sh

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-sync-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge pinned upstream with reviewed resolutions
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=03ec6df6228ac8257a737261d17e746c665b1e13
          git config user.name "777genius"
          git config user.email "13103045+777genius@users.noreply.github.com"
          git remote add upstream https://github.com/dart-lang/dartdoc.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "Pinned upstream is already an ancestor."
            exit 0
          fi
          git merge --no-commit --no-ff "$UPSTREAM_SHA" || true
          bash tool/upstream-sync-resolutions.sh
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            echo "::error::Unresolved merge conflicts"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m "chore(sync): merge dart-lang/dartdoc upstream 03ec6df"
          git push origin HEAD:refs/heads/chore/upstream-sync-2026-11-05

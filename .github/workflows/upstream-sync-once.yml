# Temporary workflow for the upstream sync draft PR.
# Remove this once the merge and all E2E gates have been validated.
name: Upstream sync inspection (temporary)

on:
  push:
    branches: [chore/upstream-sync-2026-11-05]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.final_sha.outputs.sha }}
    concurrency:
      group: upstream-sync-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge pinned upstream with reviewed resolutions
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=03ec6df6228ac8257a737261d17e746c665b1e13
          git config user.name "777genius"
          git config user.email "13103045+777genius@users.noreply.github.com"
          git remote add upstream https://github.com/dart-lang/dartdoc.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "Pinned upstream is already an ancestor."
            exit 0
          fi
          git merge --no-commit --no-ff "$UPSTREAM_SHA" || true
          bash tool/upstream-sync-resolutions.sh
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            echo "::error::Unresolved merge conflicts"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          # Co19 comment-placement fixtures intentionally contain trailing whitespace.
          git diff --cached --check -- . ':(exclude)test/co19/placement_enums_test.dart'
          git status --short
          git commit -m "chore(sync): merge dart-lang/dartdoc upstream 03ec6df"
          git push origin HEAD:refs/heads/chore/upstream-sync-2026-11-05
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: 3.11.0
      - name: Regenerate and format merged documentation assets
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 03ec6df6228ac8257a737261d17e746c665b1e13 HEAD
          dart pub get
          dart format bin lib test tool web
          dart run tool/task.dart build
          git add -u
          git diff --cached --check -- . ':(exclude)test/co19/placement_enums_test.dart'
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): regenerate resources and format merged sources"
            git push origin HEAD:refs/heads/chore/upstream-sync-2026-11-05
          fi

      - name: Record verified branch SHA
        id: final_sha
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: merge
    # GitHub Actions' GITHUB_TOKEN pushes do not trigger fresh PR workflows.
    # Verify the branch just pushed by the merge job in this same run.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.merge.outputs.sha }}
          fetch-depth: 0
      - name: Verify upstream ancestry and sync source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 03ec6df6228ac8257a737261d17e746c665b1e13 HEAD
          echo "Verified branch HEAD: $(git rev-parse HEAD)"
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: 3.11.0
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: '22'
      - name: Install Playwright chromium for browser E2E
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw-run
          cd /tmp/pw-run
          npm init -y
          npm install playwright@1.59.1
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Resolve dependencies
        run: dart pub get
      - name: Full Dart buildbot gate
        run: dart run tool/task.dart buildbot
        env:
          PLAYWRIGHT_DIR: /tmp/pw-run
      - name: Modern backends release-level E2E
        if: runner.os == 'Linux'
        run: dart run tool/task.dart validate package-release
        env:
          PLAYWRIGHT_DIR: /tmp/pw-run
      - name: Jaspr visual checks
        if: runner.os == 'Linux'
        run: dart run tool/task.dart validate jaspr-theme-visual
        env:
          PLAYWRIGHT_DIR: /tmp/pw-run
      - name: Ensure ImageMagick is available for golden checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            exit 0
          fi
          if ! command -v compare >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
          # Ubuntu 24.04 ships ImageMagick 6 (compare); the golden script
          # uses the ImageMagick 7 spelling (magick compare).
          mkdir -p "$RUNNER_TEMP/imagemagick-compat"
          cat > "$RUNNER_TEMP/imagemagick-compat/magick" <<'EOF'
          #!/bin/sh
          exec "$@"
          EOF
          chmod +x "$RUNNER_TEMP/imagemagick-compat/magick"
          echo "$RUNNER_TEMP/imagemagick-compat" >> "$GITHUB_PATH"
      - name: Pixel golden regression check (Jaspr themes)
        if: runner.os == 'Linux'
        run: dart run tool/task.dart validate jaspr-theme-golden
        env:
          PLAYWRIGHT_DIR: /tmp/pw-run
      - name: Standalone AOT E2E from outside the source tree
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/aot-fixture"
          mkdir -p "$fixture/lib" "$fixture/doc"
          cat > "$fixture/pubspec.yaml" <<'EOF'
          name: aot_smoke_fixture
          version: 0.0.1
          publish_to: none
          environment:
            sdk: ^3.11.0
          EOF
          cat > "$fixture/lib/aot_smoke_fixture.dart" <<'EOF'
          /// Minimal package for the standalone executable E2E.
          library;

          /// Demonstrates generated API documentation.
          int answer() => 42;
          EOF
          printf '%s\n' '# AOT smoke fixture' > "$fixture/README.md"
          printf '%s\n' '# Getting started' > "$fixture/doc/getting-started.md"
          dart pub get --directory "$fixture"
          dart compile exe bin/dartdoc_modern.dart -o "$RUNNER_TEMP/dartdoc_modern"
          mkdir -p "$RUNNER_TEMP/aot-smoke-cwd"
          cd "$RUNNER_TEMP/aot-smoke-cwd"
          # HTML must work with bundled resources and no source-root variable.
          env -u DARTDOC_MODERN_ROOT "$RUNNER_TEMP/dartdoc_modern" \
            --format html --input "$fixture" --output "$RUNNER_TEMP/aot-html"
          test -s "$RUNNER_TEMP/aot-html/index.html"
          test -s "$RUNNER_TEMP/aot-html/static-assets/styles.css"
          # Verify the fork's external AOT resource override and bundled fallback
          # can coexist without a source checkout.
          external_root="$RUNNER_TEMP/aot-resource-override"
          mkdir -p "$external_root/lib/resources"
          printf '%s\n' '/* AOT external override sentinel */' \
            > "$external_root/lib/resources/styles.css"
          DARTDOC_MODERN_ROOT="$external_root" "$RUNNER_TEMP/dartdoc_modern" \
            --format html --input "$fixture" --output "$RUNNER_TEMP/aot-html-external"
          grep -Fq 'AOT external override sentinel' \
            "$RUNNER_TEMP/aot-html-external/static-assets/styles.css"
          # The fork's modern backends also support the explicit root fallback.
          DARTDOC_MODERN_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/dartdoc_modern" \
            --format jaspr --input "$fixture" --output "$RUNNER_TEMP/aot-jaspr"
          test -s "$RUNNER_TEMP/aot-jaspr/pubspec.yaml"
          DARTDOC_MODERN_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/dartdoc_modern" \
            --format vitepress --input "$fixture" --output "$RUNNER_TEMP/aot-vitepress"
          test -s "$RUNNER_TEMP/aot-vitepress/package.json"
      - name: Confirm HTML, Jaspr and VitePress tests are all present
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f test/end2end/vitepress_generator_test.dart
          test -f test/end2end/jaspr_generator_test.dart
          test -f lib/src/generator/html_generator_backend.dart
          git diff --check

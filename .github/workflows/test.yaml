name: Test

on:
  # Run CI on pushes to the main branch, and on PRs against main.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: 0 15 * * *

# Declare default permissions as read only.
permissions: read-all

# A new push to a pull request supersedes its older run. Pushes to main and
# the daily schedule get a group per run, so they are never cancelled or
# queued behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUB_ENVIRONMENT: bot.github

jobs:

  generated-web-assets:
    # The normal buildbot restores committed JS after compiling, so verify
    # that the checked-in HTML frontend actually matches its Dart sources.
    name: Generated HTML resources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: '3.11.0'
      - name: Install dependencies
        run: dart pub get
      - name: Rebuild HTML frontend and bundled resources
        run: dart run tool/task.dart build web
      - name: Check generated resources are committed
        run: git diff --exit-code -- lib/resources/docs.dart.js lib/resources/docs.dart.js.map lib/resources/styles.css lib/src/generator/html_resources.g.dart web/sig.txt
      - name: Preserve regenerated resources for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-html-resources
          retention-days: 3
          path: |
            lib/resources/docs.dart.js
            lib/resources/docs.dart.js.map
            lib/resources/styles.css
            lib/src/generator/html_resources.g.dart
            web/sig.txt

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        sdk: [3.11.0, dev]
        job: [main, flutter, packages, sdk-docs, jaspr-theme]
        include:
          - os: macos-latest
            sdk: dev
            job: main
          - os: windows-latest
            sdk: dev
            job: main
        exclude:
          - os: macos-latest
            job: jaspr-theme
          - os: windows-latest
            job: jaspr-theme

    steps:
      - name: Store date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Cache clean flutter
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        if: matrix.job == 'flutter'
        env:
          # Increment version to invalidate bad/obsolete caches.
          cache-name: cache-grinder-flutter-v2
        with:
          path: ~/.dartdoc_grinder
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ steps.date.outputs.today }}
      - name: Cache .pub-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        if: matrix.job == 'flutter' || matrix.job == 'jaspr-theme'
        env:
          # Increment version to invalidate bad/obsolete caches.
          cache-name: cache-dart-pub-v1
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ steps.date.outputs.today }}
      - name: Configure git
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # Jaspr 0.23.x cannot resolve build_web_compilers on Dart >=3.14.
      # Run parent dartdoc tests on the selected SDK (including dev), but use
      # the last compatible stable toolchain to validate generated Jaspr sites.
      - name: Install compatible Jaspr scaffold SDK
        if: matrix.sdk == 'dev'
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: '3.13.7'
      - name: Record compatible Jaspr scaffold SDK (Unix)
        if: matrix.sdk == 'dev' && runner.os != 'Windows'
        shell: bash
        run: echo "JASPR_SCAFFOLD_DART_EXECUTABLE=$(command -v dart)" >> "$GITHUB_ENV"
      - name: Record compatible Jaspr scaffold SDK (Windows)
        if: matrix.sdk == 'dev' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dart = (Get-Command dart).Source
          "JASPR_SCAFFOLD_DART_EXECUTABLE=$dart" >> $env:GITHUB_ENV
      # setup-dart reuses a fixed download filename in RUNNER_TEMP. Remove the
      # *downloaded archive* after installing the auxiliary stable SDK so the
      # second action can fetch the actual selected (dev) SDK safely.
      - name: Clear temporary SDK archive (Unix)
        if: matrix.sdk == 'dev' && runner.os != 'Windows'
        shell: bash
        run: rm -f "$RUNNER_TEMP"/dartsdk-*.zip
      - name: Clear temporary SDK archive (Windows)
        if: matrix.sdk == 'dev' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:RUNNER_TEMP -Filter 'dartsdk-*.zip' -File |
            Remove-Item -Force
      - name: Set up selected Dart SDK
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install Playwright
        if: matrix.job == 'main' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p /tmp/pw-run
          cd /tmp/pw-run
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install playwright@1.59.1
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Install dependencies
        run: dart pub get
      - name: ${{ matrix.job }}
        if: runner.os != 'Windows'
        run: ./tool/ci.sh
        env:
          DARTDOC_BOT: ${{ matrix.job }}
      - name: ${{ matrix.job }}
        if: runner.os == 'Windows' && matrix.job == 'main'
        run: dart run tool\task.dart buildbot
        env:
          DARTDOC_BOT: ${{ matrix.job }}
